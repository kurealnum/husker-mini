services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-husker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-husker}
      POSTGRES_DB: ${POSTGRES_DB:-husker_mini}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-husker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-husker}:${POSTGRES_PASSWORD:-husker}@postgres:5432/${POSTGRES_DB:-husker_mini}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy

  prediction-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WORKER_SCRIPT: src/workers/prediction-worker.ts
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-husker}:${POSTGRES_PASSWORD:-husker}@postgres:5432/${POSTGRES_DB:-husker_mini}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  settlement-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WORKER_SCRIPT: src/workers/settlement-worker.ts
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-husker}:${POSTGRES_PASSWORD:-husker}@postgres:5432/${POSTGRES_DB:-husker_mini}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
